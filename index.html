<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#8f9d3d" />
    <title>AI Team HQ</title>
    <script>
      // Set the theme before the first paint so dark mode never flashes light.
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('hq.theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {
          /* storage blocked: stay light */
        }
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#2b3016');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
